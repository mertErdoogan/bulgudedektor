# Arena Dedektör — Render ÜCRETSİZ ön izleme (geliştirme aşaması, telefondan görmek için)
# Render → New → Blueprint → bu repo. main dalına her push otomatik yayına alınır. Kart gerekmez.
# Ücretsiz planın sınırları ve ücretli plana geçiş: docs/ONIZLEME.md
services:
  - type: web
    name: arena-onizleme
    runtime: docker
    region: frankfurt
    plan: free               # 15 dk kullanılmazsa uyur; ilk açılış ~1 dk. Kalıcı disk yok.
    branch: main
    autoDeploy: true         # main'e her push → yeni sürüm (derleme hatalıysa eski sürüm yayında kalır)
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arena-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PREPROD
        value: "1"
      - key: SEED_DEMO
        value: "1"
      - key: PAYMENT_SIMULATION
        value: force-test-only
      - key: TZ
        value: Europe/Istanbul
      # Ücretsiz planda kalıcı disk yok: panelden yüklenen görseller güncellemede/uykuda silinir (demo görseller kalır)
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: PREVIEW_USER
        value: arena
      # Kurulumda Render sorar: siteyi açarken istenecek şifre
      - key: PREVIEW_PASSWORD
        sync: false
      # Kurulumda Render sorar: panel (admin@arenadedektor.local) şifresi, en az 10 karakter
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: arena-db
    region: frankfurt
    plan: free               # 30 gün sonra Render siler (öncesinde e-postayla uyarır); bkz. docs/ONIZLEME.md
    postgresMajorVersion: "17"
    ipAllowList: []          # yalnızca Render içinden erişim
