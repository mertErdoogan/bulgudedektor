# Tek sunucuda canlı kurulum: PostgreSQL + uygulama + Caddy (otomatik HTTPS) + zamanlanmış işler.
# 1) cp .env.example .env  ve değerleri doldurun (DOMAIN, POSTGRES_PASSWORD, AUTH_SECRET, CRON_SECRET, APP_URL)
# 2) docker compose up -d --build
# 3) docker compose exec app npm run db:init   (ADMIN_EMAIL / ADMIN_PASSWORD ile)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: magaza
      POSTGRES_USER: magaza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magaza -d magaza"]
      interval: 10s
      retries: 10

  app:
    build:
      context: .
      args:
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://magaza:${POSTGRES_PASSWORD}@db:5432/magaza
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
      TZ: Europe/Istanbul
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN gerekli (ör. www.derinova.example)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Her 15 dakikada /api/cron: süresi dolan ödemeler, sepet hatırlatma, yorum daveti, Trendyol senkronu, temizlik
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET gerekli}
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 900; curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron || true; echo; done"]
    depends_on:
      - app

  # Her gece 03:30 yedek: veritabanı (+ pazar günleri görseller) → ./backups ve BACKUP_S3_BUCKET tanımlıysa sunucu dışı (R2/S3).
  # Ayrıntı ve geri yükleme: deploy/backup.sh ve docs/KURULUM.md
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      TZ: Europe/Istanbul
    volumes:
      - ./backups:/backups
      - ./deploy:/deploy:ro
      - uploads:/uploads:ro
    entrypoint: ["/bin/sh", "-c", "while true; do now=$$(date +%H%M); if [ \"$$now\" = \"0330\" ]; then sh /deploy/backup.sh || echo '[yedek] HATA'; sleep 60; fi; sleep 30; done"]
    depends_on:
      - db

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
